name: CI

# CI for Aetheria (decisions D-012, foundation hardening).
# Gates, in order — each FAILS the job on a non-zero exit (no failures are swallowed):
#   1. checkout
#   2. GDScript static lint, engine-free (tools/gdscript_lint.py — D-033; runs first so a
#      compile-breaking warning-as-error or a private-access break fails in seconds)
#   3. download Godot 4.7 (matches project.godot feature tag "4.7")
#   4. import project (generate .godot resource cache)
#   5. project-wide GDScript COMPILE check (src/ + tests/ + tools/ — load + can_instantiate
#      + class_name registration, D-033)
#   6. runtime boot smoke (boot application/run/main_scene headless, run _ready, exit)
#   7. headless test suite (custom runner — unit + integration + gameplay; excludes tests/e2e/)
#      ALSO fails on any `SCRIPT ERROR:` even when the runner exits 0: a VM error aborts a
#      test method, which the runner cannot distinguish from a passing one (D-037 follow-up)
#   8. real-application E2E flow (dedicated isolated process — D-019)
#   9. player sandbox E2E flow (dedicated isolated process — Phase 02)
#  10. world/map E2E flow (dedicated isolated process — Phase 03)
#  11. pet / linh thú E2E flow (dedicated isolated process — Phase 16)
#  12. NPC / interaction / shop E2E flow (dedicated isolated process — Phase 17)
#
# NOTE: authored while the agent could not run Godot/Actions locally (D-009). All
# scripts were statically validated via the GDScript language server. The first real
# execution is this workflow on GitHub. Manual local equivalents are in docs/TEST_PLAN.md.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  foundation:
    name: Foundation gates (Godot 4.7)
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7-stable"
      GODOT_BIN: Godot_v4.7-stable_linux.x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Needs no engine, so it runs BEFORE the Godot download and fails fastest. It is the
      # SAME command a developer runs on save (D-033), and it catches the class of bug that
      # previously cost a whole CI round just to become readable (L-020). `--selftest`
      # first: a linter whose rules silently stopped matching is worse than no linter.
      - name: GDScript static lint (no engine required)
        run: |
          set -uo pipefail
          # The findings ARE the point of this gate, so it surfaces them as GitHub
          # annotations and in the step summary rather than only setting an exit code.
          # Actions logs need auth to read (D-009), so a bare "exit code 1" would cost a
          # whole round-trip just to learn which rule fired - the exact failure mode
          # steering 10 exists to prevent. This is a permanent part of the gate, not
          # temporary diagnostic scaffolding.
          set +e
          python3 -V 2>&1 | tee _lint.log
          python3 tools/gdscript_lint.py --selftest 2>&1 | tee -a _lint.log
          selftest_rc=${PIPESTATUS[0]}
          python3 tools/gdscript_lint.py 2>&1 | tee -a _lint.log
          scan_rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### GDScript lint (selftest rc=$selftest_rc, scan rc=$scan_rc)"
            echo '```'
            cat _lint.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$selftest_rc" -ne 0 ] || [ "$scan_rc" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::[gdlint] ${line}"
            done < _lint.log
            exit 1
          fi

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/${GODOT_BIN}.zip"
          echo "Downloading $URL"
          curl -fL --retry 3 -o godot.zip "$URL"
          unzip -q godot.zip
          chmod +x "${GODOT_BIN}"
          ./${GODOT_BIN} --version

      - name: Import project
        run: |
          set -euo pipefail
          # Generates the .godot resource cache. Not swallowed: if import fails, the job
          # fails here.
          ./${GODOT_BIN} --headless --path . --import

      - name: GDScript parse check (whole project)
        run: |
          set -uo pipefail
          # Compile-checks every .gd under src/ tests/ tools/ (load + can_instantiate +
          # class_name registration, D-033). Like the lint gate, it SURFACES which file and
          # which check failed instead of only setting an exit code: Actions logs need auth
          # to read (D-009), so a bare "exit code 1" costs a whole round-trip to diagnose.
          set +e
          ./${GODOT_BIN} --headless --path . -s res://tools/parse_check.gd 2>&1 | tee _parse.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Parse/compile check (rc=$rc)"
            echo '```'
            tail -n 120 _parse.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep -E 'FAIL|ERROR|NOTE' _parse.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::[parse_check] ${line}"
            done
            exit "$rc"
          fi

      - name: Runtime boot smoke
        run: |
          set -euo pipefail
          # Boots the real project from application/run/main_scene, runs Main._ready(),
          # then quits after 2 frames. Fails the job if boot crashes.
          ./${GODOT_BIN} --headless --path . --quit-after 2

      - name: Headless test suite
        run: |
          set -uo pipefail
          # Custom runner: exits non-zero on any failing assertion / missing smoke test.
          # Unit + integration tests only; it EXCLUDES tests/e2e/ and never boots Main, so
          # it cannot contaminate the shared /root autoloads (D-019). It also fails if any
          # test mutates the shared GameState (isolation guard).
          #
          # TEST-INTEGRITY CHECK (D-037 follow-up): the runner can only see RECORDED ASSERTION
          # failures. A hard GDScript VM error (bad typed-array assignment, a call on null, a
          # missing property) ABORTS the running test method instead of failing it, so the
          # method ends with zero recorded failures and is reported as [PASS] while having
          # executed nothing. That is how six relationship-config tests and one rule-catalog
          # test sat green for two phases without ever running their logic. So this gate now
          # also fails when the output contains `SCRIPT ERROR:`, even if the runner exits 0.
          #
          # `push_error()` from a deliberate negative test prints `ERROR:`/`USER ERROR:`, NOT
          # `SCRIPT ERROR:` — that prefix is specifically the GDScript VM reporting a runtime
          # fault, so intentional fail-closed tests do not trip this.
          set +e
          ./${GODOT_BIN} --headless --path . -s res://tests/run_tests.gd 2>&1 | tee _suite.log
          rc=${PIPESTATUS[0]}
          set -e
          script_errors=$(grep -c 'SCRIPT ERROR:' _suite.log || true)
          leaks=$(grep -cE 'ObjectDB instances were leaked|resources still in use' \
            _suite.log || true)
          {
            echo "### Headless test suite (rc=$rc, SCRIPT ERROR lines=$script_errors," \
              "leak lines=$leaks)"
            echo '```'
            grep -E '^\[tests\]|RESULT:' _suite.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Surface the runner's own tally as an ANNOTATION. The step summary and the raw log
          # both need authenticated access to read (D-009), while annotations are available
          # on the public check-run API — so this is the only way the real
          # "ran N test(s): X passed, Y failed" number can be quoted in the docs instead of
          # being counted by hand. A notice never affects the gate's verdict.
          grep -E '^\[tests\] ran ' _suite.log | while IFS= read -r line; do
            echo "::notice::[tests] ${line}"
          done
          if [ "$rc" -ne 0 ]; then
            grep -E '\[FAIL\]|RESULT:' _suite.log | tail -n 40 \
              | while IFS= read -r line; do echo "::error::[tests] ${line}"; done
            exit "$rc"
          fi
          if [ "$script_errors" -ne 0 ]; then
            {
              echo '```'
              grep -A2 'SCRIPT ERROR:' _suite.log | head -n 60
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep 'SCRIPT ERROR:' _suite.log | head -n 20 \
              | while IFS= read -r line; do echo "::error::[test-integrity] ${line}"; done
            echo "::error::[test-integrity] ${script_errors} SCRIPT ERROR line(s): a test" \
              "method aborted instead of running. The runner reported PASS because it only" \
              "counts assertion failures. Fix the fixture."
            exit 1
          fi
          # LEAK CHECK (D-047). Same shape as the SCRIPT ERROR check above and for the same
          # reason: the engine reports a leak at SHUTDOWN as a non-fatal warning, so the
          # process still exits 0 and the gate stayed green while the suite leaked. L-019
          # already says a clean suite must end with 0 leaked ObjectDB / 0 resources in use —
          # this makes that rule enforced instead of merely written down. It found a
          # pre-existing RefCounted reference CYCLE in the faction fixture (a resolver lambda
          # capturing `self`, held by a service kept on the test instance), which pinned one
          # test instance and every script it referenced. Still part of the SAME gate, so the
          # gate count is unchanged at 10.
          if [ "$leaks" -ne 0 ]; then
            {
              echo '```'
              grep -E 'ObjectDB instances were leaked|resources still in use' _suite.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E 'ObjectDB instances were leaked|resources still in use' _suite.log \
              | while IFS= read -r line; do echo "::error::[leak] ${line}"; done
            echo "::error::[leak] the suite leaked at exit. A Node created in a test must be" \
              "freed by that test (L-019), and a RefCounted CYCLE (e.g. a lambda capturing" \
              "\`self\` stored on a service the test instance holds) must be broken in" \
              "after_each — GDScript reference-counts, it does not collect cycles."
            exit 1
          fi

      - name: Real-application E2E flow
        run: |
          set -euo pipefail
          # Dedicated, ISOLATED process (D-019): boots the real main.tscn against the actual
          # project autoloads, drives MainMenu "New Game" → first scene → RUNNING, then cleans
          # up. Separate process so the real boot can't contaminate the unit/integration
          # suite. Exits non-zero on any failed assertion; not swallowed.
          ./${GODOT_BIN} --headless --path . -s res://tests/e2e/run_app_flow.gd

      - name: Player sandbox E2E flow (Phase 02)
        run: |
          set -euo pipefail
          # Dedicated, ISOLATED process (D-019): boots the real app, New Game → Player
          # Sandbox, then exercises real movement + the bidirectional damage exchange with
          # the Training Dummy + deterministic death + clean teardown. Separate process so
          # it can't contaminate the shared suite. Non-zero exit on any failure; not swallowed.
          ./${GODOT_BIN} --headless --path . -s res://tests/e2e/run_player_flow.gd

      - name: World/Map E2E flow (Phase 03)
        run: |
          set -uo pipefail
          # Dedicated, ISOLATED process (D-019): boots the real app, New Game → hub map,
          # then drives REAL input (parse_input_event) to transition hub ↔ field 20×, the
          # persistent player surviving each swap with no orphan-node leak, the camera
          # following the player, then a REAL `open_menu` returns to the menu.
          # The runner prints `[e2e-world] [FAIL] <assertion>` lines; they are surfaced as
          # annotations so a failing assertion is readable without log access (D-009).
          set +e
          ./${GODOT_BIN} --headless --path . -s res://tests/e2e/run_world_flow.gd 2>&1 \
            | tee _e2e_world.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### World/Map E2E (rc=$rc)"
            echo '```'
            tail -n 120 _e2e_world.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep -E 'FAIL|ERROR|RESULT' _e2e_world.log | tail -n 40 \
              | while IFS= read -r line; do echo "::error::[e2e-world] ${line}"; done
            exit "$rc"
          fi

      - name: Pet / Linh Thú E2E flow (Phase 16)
        run: |
          set -uo pipefail
          # Dedicated, ISOLATED process (D-019): boots the real app and drives the companion
          # loop with semantic inputs — befriend the stray, follow, dismiss / recall, cross a
          # map change, assist in a real fight (rewards paid once), return to menu.
          # A `SCRIPT ERROR:` or a leak line fails the gate even when the runner exits 0: a VM
          # error aborts the case mid-way, which an exit code cannot distinguish from a pass.
          set +e
          ./${GODOT_BIN} --headless --path . -s res://tests/e2e/run_pet_flow.gd 2>&1 \
            | tee _e2e_pet.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### Pet E2E (rc=$rc)"
            echo '```'
            tail -n 60 _e2e_pet.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep -E 'FAIL|ERROR|RESULT' _e2e_pet.log | tail -n 40 \
              | while IFS= read -r line; do echo "::error::[e2e-pet] ${line}"; done
            exit "$rc"
          fi
          if grep -E 'SCRIPT ERROR:|ObjectDB instances were leaked|resources still in use' \
              _e2e_pet.log; then
            echo "::error::[e2e-pet] the run printed a script error or a leak line"
            exit 1
          fi

      - name: NPC / Shop E2E flow (Phase 17)
        run: |
          set -uo pipefail
          # Dedicated, ISOLATED process (D-019): boots the real app and drives the shop loop
          # with semantic inputs — walk into reach of an NPC, interact, sell and buy, a refused
          # purchase that changes nothing, Esc closes the shop and gameplay input returns.
          # A `SCRIPT ERROR:` or a leak line fails the gate even when the runner exits 0: a VM
          # error aborts the case mid-way, which an exit code cannot distinguish from a pass.
          set +e
          ./${GODOT_BIN} --headless --path . -s res://tests/e2e/run_npc_flow.gd 2>&1 \
            | tee _e2e_npc.log
          rc=${PIPESTATUS[0]}
          set -e
          {
            echo "### NPC / Shop E2E (rc=$rc)"
            echo '```'
            tail -n 60 _e2e_npc.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then
            grep -E 'FAIL|ERROR|RESULT' _e2e_npc.log | tail -n 40 \
              | while IFS= read -r line; do echo "::error::[e2e-npc] ${line}"; done
            exit "$rc"
          fi
          if grep -E 'SCRIPT ERROR:|ObjectDB instances were leaked|resources still in use' \
              _e2e_npc.log; then
            echo "::error::[e2e-npc] the run printed a script error or a leak line"
            exit 1
          fi
