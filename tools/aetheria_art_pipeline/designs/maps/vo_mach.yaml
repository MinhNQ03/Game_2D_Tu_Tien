# RỪNG VỠ MẠCH — the Broken-Vein Forest (map_field). D-062 world pass.
#
# Canon (WORLD_BIBLE §4.5, CL-08, CL-11): the forest beside Thôn Lạc Hà where the vein beneath
# breaks — mist, wolves, an unstable seam of qi. A game trail runs from the village gate (west)
# into a clearing; one branch climbs to the north-east rocks (the Lôi manual's cairn), one goes
# down to the BROKEN VEIN, where fractured stone seeps qi along its cracks.
#
# Fixed anchors (scene + tests): spawn (496,304), from_hub (92,304), exit to hub (48,304), the
# broken vein site (616,472), pickups (598,486) (640,462) (420,300) (690,190); wolves spawn at
# (680,76) and (360,536) (data/enemies/spawn_table_field.tres).
#
# TERRITORY (PX-2; D-073 follow-up, H21-16). The cairn wolf lies up in the glade NORTH of the
# wreck, off the road, at (680,76). Its REACH is how far it strays plus how far it notices:
# a 32 px patrol ground (+ one decision's step, 42.6 px) + 170 px = 212.6 px. That holds the
# wreck and the west half of the old haul track - the CONTESTED way to the Survey Shaft,
# marked at its two edges by what the wolf has left on the ground (`WolfSign`) - and does
# NOT reach the forest road, the clearing where the survey stake stood, or the surveyors'
# footpath up to the shaft's door: the SAFE way.
# Two things were wrong before, both measured in the real window: it stood at (632,168),
# 127 px from the socket the bridge makes the player examine; and its patrol was a random
# walk bounded only by its 340 px leash, so no den position could have kept it off the clue
# (seen 205 px from home). The patrol ground is `AiProfileData.patrol_radius`;
# `test_nothing_the_player_must_reach_in_the_woods_is_inside_a_creatures_territory` holds the
# placement to it.
#
# D-073: the Survey Shaft (Hầm Khảo Mạch) is set into the NE rocks — the fourth and last point
# of the survey line whose third stake stood in the clearing at (548,262). Its door faces the
# haul track's end, on the SOUTH lip of the rocks: in the map's top-right corner the camera
# stops at the edge and the place plaque covers what stands there (seen in the real window),
# so the door is kept below it. RockNE1 / RockNE2 / PineE2 moved to frame it, not block it.

