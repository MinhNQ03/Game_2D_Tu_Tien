# The protagonist as a PHÀM wanderer (Lữ khách) — THE golden reference actor (D-062 CP3).
#
# Identity (D-046, CHARACTER_ART_BIBLE §5): waist-length silver-white hair, a pale layered
# floor-length robe, jade the one saturated accent. Hair is lighter and cooler than the robe so
# the two masses separate by VALUE at 32x48 (character.value_separation_min).
#
# Art pass D-074: the figure read flat at 1x — the hair merged with the near-white robe, the
# jade sash was a thin stripe, the shoes hid under the hem. The overrides below keep the same
# body, cut and motion; they widen the hair into a real second mass, deepen the robe a step
# for hair/robe value separation, broaden the sash band with longer tails, and lift the front
# hem so the shoes ground the figure. Original Aetheria art, built by the pipeline.
id: player_proto
extends: cultivator
role: "protagonist, PHÀM wanderer"
pieces: [pendant]

# D-074 silhouette tuning: slightly broader shoulders and a wider hem so the robe reads as a
# floor-length A-line, not a tube.
body:
  shoulder_x: 6.1

garment:
  bodice:                           # the outer robe above the sash: [z, rx, ry]
    - [25.0, 4.9, 3.5]
    - [29.0, 5.6, 3.9]
    - [32.2, 6.3, 4.0]
    - [33.9, 5.3, 3.5]
    - [34.8, 2.6, 2.4]
  skirt:                            # outer robe below the sash: [z, rx, ry]
    - [25.4, 5.1, 3.7]
    - [19.0, 6.0, 4.5]
    - [10.0, 7.0, 5.3]
    - [3.0, 7.8, 5.9]
    - [1.1, 8.0, 6.1]
  hem_front_lift: 3.2               # the shoes show below the hem in the front view
  sash: {z: [23.2, 26.8], out: 0.5, knot: [-2.2, -3.9, 25.0], tail_length: 9.5}

# D-074: the back hair was a narrow strip behind the body; now it is a second flowing mass —
# longer (past the waist), wider, with more flare at the ends.
hair:
  back: {top_z: 46.6, bottom_z: 19.5, width: [8.8, 7.6, 2.4], thickness: 2.5, flare: 1.1}

# Ramps are [deep, shadow, base, light]: the only tones a material may take in a sprite.
# D-074: the robe steps one value deeper so the silver hair separates from it by VALUE.
materials:
  skin:       {ramp: ["#a5705e", "#d09c82", "#eec9ae", "#f9e2ce"], min_tone: 2}
  hair:       {ramp: ["#7b7f98", "#b2b7cb", "#dde1ed", "#f6f7fb"], highlight: true}
  robe:       {ramp: ["#39445e", "#5f6c8c", "#8b99b8", "#b7c2d8"], highlight: true}
  robe_inner: {ramp: ["#9298a8", "#c9ced8", "#eceef3", "#ffffff"]}
  trim:       {ramp: ["#242b3d", "#323b53", "#45516c", "#5c6987"], priority: 1.6, flat: true}
  sash:       {ramp: ["#164638", "#215f4e", "#2d7c64", "#4ca383"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#1e232e", "#2a303e", "#384052", "#4a5366"]}
  shoe:       {ramp: ["#13151c", "#1d2029", "#2a2e3a", "#3a3f4e"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}
  pendant:    {ramp: ["#1d5847", "#2a7660", "#5cc79e", "#a3e6c8"], priority: 2.5, flat: true}

outputs:
  sheet_prefix: player_proto
  anchors: player_proto_anchors
  profile: player_visual                 # data/characters/visual/<profile>.tres (checked: anchor_offset)
  fallback: player_proto           # player.tscn's static harness frame
  portrait: player_proto

# The jian's cut (D-063 A3). Only the player's looks wield a sword, so only they carry the SLASH
# action (`AttackData.body_action` names it; a look without it falls back to the palm strike) and
# the `blade` anchor: the blade held IN LINE with the right hand, 20 units from the grip to the
# tip, so the drawn blade and the cut's trail follow the rig's own hand, frame by frame. `depth`
# exports how far in front of the body the tip is, so the blade is layered in front of the
# body or behind it as the rig actually holds it.
animations:
  slash: {frames: 8, loops: false}
anchors:
  blade: {bone: hand.R, along: 20.0, depth: true}
