# Origin portrait: the WANDERING HEALER (Lang Y Du Phương) — a healer who reads pulses on
# the road. A pale herb-tinted robe, a deep herb-green sash, dark hair tied low with no
# topknot (a healer's hands are always busy). Original Aetheria art, built by the pipeline
# (D-074).
#
# Full animation sheets + anchors + portrait; no runtime profile (origins are chosen on
# the identity screen, never walked — the sheets are there if an origin NPC ever needs them).
id: origin_lang_y
extends: cultivator
role: "origin portrait: the wandering healer"
pieces: []

# No topknot: the hair is tied low and falls down the back.
hair:
  back: {top_z: 46.2, bottom_z: 24.0, width: [7.4, 6.2, 1.6], thickness: 2.2, flare: 0.8}
  bun: null
  pin: null

materials:
  skin:       {ramp: ["#a5705e", "#d09c82", "#eec9ae", "#f9e2ce"], min_tone: 2}
  hair:       {ramp: ["#211d1a", "#38312c", "#504741", "#695d55"], highlight: true}
  robe:       {ramp: ["#59645c", "#79857a", "#9aa49b", "#bcc4bd"], highlight: true}
  robe_inner: {ramp: ["#a3aca4", "#c2c9c3", "#dfe3df", "#f2f4f2"]}
  trim:       {ramp: ["#3c443d", "#525a53", "#6a736b", "#878f88"], priority: 1.6, flat: true}
  sash:       {ramp: ["#274a38", "#38634f", "#4c7d65", "#689981"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#2b302c", "#3b423c", "#4e554e", "#626a62"]}
  shoe:       {ramp: ["#171a18", "#222724", "#2f3630", "#3f4840"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}

outputs:
  sheet_prefix: origin_lang_y
  anchors: origin_lang_y_anchors
  portrait: origin_lang_y

