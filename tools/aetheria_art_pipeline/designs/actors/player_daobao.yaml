# The protagonist wearing the Thanh Vân outer-disciple robe (Đạo bào, P14 equipment) — the SAME
# body, cut and motion as player_proto; only the garment colours change. That is the point of
# the pipeline: an equipment visual is design data, never a second drawing (D-062 CP9).
#
# The robe takes the sect's deep jade-blue, so the robe itself is the figure's saturated mass;
# the sash steps back to ivory and the trim to antique gold, keeping ONE accent per figure.
#
# D-074: this look is the SAME body, cut and motion as player_proto (see its header), so it
# takes the same silhouette overrides — the wider hair mass, broader sash, visible shoes.
# Only the garment colours differ.
id: player_daobao
extends: cultivator
role: "protagonist in the Thanh Vân outer-disciple robe"
pieces: [pendant]

body:
  shoulder_x: 6.1

garment:
  bodice:                           # the outer robe above the sash: [z, rx, ry]
    - [25.0, 4.9, 3.5]
    - [29.0, 5.6, 3.9]
    - [32.2, 6.3, 4.0]
    - [33.9, 5.3, 3.5]
    - [34.8, 2.6, 2.4]
  skirt:                            # outer robe below the sash: [z, rx, ry]
    - [25.4, 5.1, 3.7]
    - [19.0, 6.0, 4.5]
    - [10.0, 7.0, 5.3]
    - [3.0, 7.8, 5.9]
    - [1.1, 8.0, 6.1]
  hem_front_lift: 3.2               # the shoes show below the hem in the front view
  sash: {z: [23.2, 26.8], out: 0.5, knot: [-2.2, -3.9, 25.0], tail_length: 9.5}

hair:
  back: {top_z: 46.6, bottom_z: 19.5, width: [8.8, 7.6, 2.4], thickness: 2.5, flare: 1.1}

materials:
  skin:       {ramp: ["#a5705e", "#d09c82", "#eec9ae", "#f9e2ce"], min_tone: 2}
  hair:       {ramp: ["#7b7f98", "#b2b7cb", "#dde1ed", "#f6f7fb"], highlight: true}
  robe:       {ramp: ["#18324a", "#28536f", "#3c7591", "#6fa9bf"], highlight: true}
  robe_inner: {ramp: ["#8f969f", "#c8ccd2", "#e9ebee", "#ffffff"]}
  trim:       {ramp: ["#5b4524", "#7f6436", "#a88a4f", "#c9a865"], priority: 1.6, flat: true}
  sash:       {ramp: ["#8c8573", "#b8b09c", "#ddd6c4", "#f3eee2"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#1e232e", "#2a303e", "#384052", "#4a5366"]}
  shoe:       {ramp: ["#13151c", "#1d2029", "#2a2e3a", "#3a3f4e"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}
  pendant:    {ramp: ["#1d5847", "#2a7660", "#5cc79e", "#a3e6c8"], priority: 2.5, flat: true}

outputs:
  sheet_prefix: player_daobao
  anchors: player_daobao_anchors
  profile: player_daobao_visual                 # data/characters/visual/<profile>.tres (checked: anchor_offset)
  portrait: player_daobao

# The jian's cut (D-063 A3). Only the player's looks wield a sword, so only they carry the SLASH
# action (`AttackData.body_action` names it; a look without it falls back to the palm strike) and
# the `blade` anchor: the blade held IN LINE with the right hand, 20 units from the grip to the
# tip, so the drawn blade and the cut's trail follow the rig's own hand, frame by frame. `depth`
# exports how far in front of the body the tip is, so the blade is layered in front of the
# body or behind it as the rig actually holds it.
animations:
  slash: {frames: 8, loops: false}
anchors:
  blade: {bone: hand.R, along: 20.0, depth: true}
