# The protagonist wearing the Thanh Vân outer-disciple robe (Đạo bào, P14 equipment) — the SAME
# body, cut and motion as player_proto; only the garment colours change. That is the point of
# the pipeline: an equipment visual is design data, never a second drawing (D-062 CP9).
#
# The robe takes the sect's deep jade-blue, so the robe itself is the figure's saturated mass;
# the sash steps back to ivory and the trim to antique gold, keeping ONE accent per figure.
id: player_daobao
extends: cultivator
role: "protagonist in the Thanh Vân outer-disciple robe"
pieces: [pendant]

materials:
  skin:       {ramp: ["#a5705e", "#d09c82", "#eec9ae", "#f9e2ce"], min_tone: 2}
  hair:       {ramp: ["#7b7f98", "#b2b7cb", "#dde1ed", "#f6f7fb"], highlight: true}
  robe:       {ramp: ["#18324a", "#28536f", "#3c7591", "#6fa9bf"], highlight: true}
  robe_inner: {ramp: ["#8f969f", "#c8ccd2", "#e9ebee", "#ffffff"]}
  trim:       {ramp: ["#5b4524", "#7f6436", "#a88a4f", "#c9a865"], priority: 1.6, flat: true}
  sash:       {ramp: ["#8c8573", "#b8b09c", "#ddd6c4", "#f3eee2"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#1e232e", "#2a303e", "#384052", "#4a5366"]}
  shoe:       {ramp: ["#13151c", "#1d2029", "#2a2e3a", "#3a3f4e"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}
  pendant:    {ramp: ["#1d5847", "#2a7660", "#5cc79e", "#a3e6c8"], priority: 2.5, flat: true}

outputs:
  sheet_prefix: player_daobao
  anchors: player_daobao_anchors
  profile: player_daobao_visual                 # data/characters/visual/<profile>.tres (checked: anchor_offset)
  portrait: player_daobao
