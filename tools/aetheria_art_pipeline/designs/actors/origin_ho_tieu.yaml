# Origin portrait: the FAILED ESCORT (Hộ Tiêu Thất Bại) — a caravan guard whose charge was
# destroyed on the road. Road-worn bronze-brown robe, a rust-red sash, dark hair bound under a
# traveller's cloth wrap (cap). Original Aetheria art, built by the pipeline (D-074).
#
# Full animation sheets + anchors + portrait; no runtime profile (origins are chosen on
# the identity screen, never walked — the sheets are there if an origin NPC ever needs them).
id: origin_ho_tieu
extends: cultivator
role: "origin portrait: the failed escort, a caravan guard"
pieces: [cap]

# A guard's practical hair: bound back under the wrap, shoulder-length, no topknot.
hair:
  back: {top_z: 46.0, bottom_z: 31.0, width: [7.6, 6.4, 1.8], thickness: 2.2, flare: 0.7}
  bun: null
  pin: null

materials:
  skin:       {ramp: ["#a5705e", "#d09c82", "#eec9ae", "#f9e2ce"], min_tone: 2}
  hair:       {ramp: ["#241d18", "#3a2f26", "#54463a", "#71604f"], highlight: true}
  robe:       {ramp: ["#453522", "#634e35", "#83705a", "#a68e74"], highlight: true}
  robe_inner: {ramp: ["#8f8578", "#b3a897", "#d3c9b8", "#e8e0d2"]}
  trim:       {ramp: ["#2b2119", "#3d2f22", "#54432f", "#6e5a40"], priority: 1.6, flat: true}
  sash:       {ramp: ["#5e2318", "#7e3322", "#a34a2e", "#c46a45"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#2a241e", "#3a3229", "#4d4437", "#61564a"]}
  shoe:       {ramp: ["#1a1512", "#26201b", "#352c24", "#473c30"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}
  accent:     {ramp: ["#6b5f4c", "#877a63", "#a39681", "#bfae97"], priority: 1.4, flat: true}

outputs:
  sheet_prefix: origin_ho_tieu
  anchors: origin_ho_tieu_anchors
  portrait: origin_ho_tieu

