# Thẩm Bất Kỳ (Shen Buqi) — Trưởng lão Thanh Đài. The elder: the SAME rig as every humanoid.
#
# Identity (CHARACTER_ART_BIBLE §5 "grey/white elder"): white topknot and a long white beard,
# a broad bell of a robe with deep, low-hanging sleeves (the sleeves ARE the silhouette — an
# elder's authority is in the sleeve, not in armour), ash-grey cloth, an antique-gold sash as
# the one note of rank. Shoulder-length back hair: no waist-length mass to confuse him with
# the protagonist from behind.
id: shen_buqi
extends: cultivator
role: "elder of the Azure Terrace"
pieces: [beard]

body:
  scale: 1.0
  shoulder_x: 6.1
garment:
  skirt:
    - [25.4, 5.2, 3.8]
    - [19.0, 6.2, 4.6]
    - [10.0, 7.2, 5.4]
    - [3.0, 7.9, 5.9]
    - [1.1, 8.1, 6.0]
  sleeve:
    profile: [[0.0, 2.2], [0.35, 2.6], [0.62, 3.2], [0.85, 3.8], [1.0, 4.1]]
    droop: 4.6
hair:
  back: {top_z: 46.0, bottom_z: 33.5, width: [7.4, 6.6, 4.4], thickness: 1.8, flare: 0.4}
  locks: null
  fringe: {cut_z: 44.2, scale: 1.06}
  bangs: null                     # an elder wears it all drawn up into the topknot
  bun: {centre: [0.0, 1.2, 48.4], radius: 2.1}
  pin: {length: 7.0, radius: 0.45}

materials:
  skin:       {ramp: ["#9b6a58", "#c8977f", "#e6c2a8", "#f3dcc8"], min_tone: 2}
  hair:       {ramp: ["#7d8088", "#b6b9c0", "#e2e4e8", "#f8f9fa"], highlight: true}
  robe:       {ramp: ["#3c4045", "#62686e", "#8a9096", "#b0b5ba"], highlight: true}
  robe_inner: {ramp: ["#8c8f93", "#c1c4c7", "#e4e6e8", "#ffffff"]}
  trim:       {ramp: ["#22252a", "#2e3238", "#3c4148", "#4d535b"], priority: 1.6, flat: true}
  sash:       {ramp: ["#5b4524", "#7f6436", "#a88a4f", "#c9a865"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#1e2024", "#2a2d32", "#383c42", "#4a4f56"]}
  shoe:       {ramp: ["#141416", "#1e1f22", "#2a2b2f", "#3a3b40"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}

animations:
  talk: {frames: 6, loops: false}          # an elder speaking: the deep sleeve lifts (Phase 18)

outputs:
  sheet_prefix: elder_proto
  anchors: elder_anchors
  profile: elder_visual                 # data/characters/visual/<profile>.tres (checked: anchor_offset)
  portrait: elder_proto
