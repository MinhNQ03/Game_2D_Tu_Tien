# Origin portrait: the KEEPER OF FORBIDDEN RECORDS (Thủ Thư Cấm Lục) — a scholar who guards
# what must not be read. An ink-dark scholar's robe, an antique-gold sash, black hair in a
# tall neat topknot with a gold pin. Original Aetheria art, built by the pipeline (D-074).
#
# Full animation sheets + anchors + portrait; no runtime profile (origins are chosen on
# the identity screen, never walked — the sheets are there if an origin NPC ever needs them).
id: origin_thu_thu
extends: cultivator
role: "origin portrait: the keeper of forbidden records"
pieces: []

# A tall, formal topknot: the scholar's crown.
hair:
  bun: {centre: [0.0, 1.2, 49.2], radius: 2.1}

materials:
  skin:       {ramp: ["#a5705e", "#d09c82", "#eec9ae", "#f9e2ce"], min_tone: 2}
  hair:       {ramp: ["#16141a", "#292530", "#3e3947", "#575061"], highlight: true}
  robe:       {ramp: ["#202839", "#2f3a4f", "#434f66", "#5b6880"], highlight: true}
  robe_inner: {ramp: ["#7e8899", "#a2abb9", "#c6ccd5", "#dee3e9"]}
  trim:       {ramp: ["#5e4a24", "#7d6332", "#9c7f47", "#bfa065"], priority: 1.6, flat: true}
  sash:       {ramp: ["#54411f", "#70582c", "#8d7040", "#aa8c58"], priority: 1.3, flat: true}
  trousers:   {ramp: ["#1e2330", "#2a3140", "#394154", "#4a5468"]}
  shoe:       {ramp: ["#12141b", "#1b1f28", "#262b36", "#333947"]}
  eye:        {ramp: ["#12121a", "#12121a", "#12121a", "#12121a"], priority: 4.0, min_coverage: 5}
  pin:        {ramp: ["#5b4524", "#86683a", "#c9a865", "#e6cf93"], priority: 2.0, flat: true}

outputs:
  sheet_prefix: origin_thu_thu
  anchors: origin_thu_thu_anchors
  portrait: origin_thu_thu

