# AETHERIA VISUAL DNA — style version 1.0 (D-062)
#
# THE machine-readable source of truth for how Aetheria looks. One DNA, many representations:
# every producer (the Blender character/prop/UI/icon renders, the pixel adapter, the Godot UI
# palette) reads THIS file, and `validate/style_check.py` measures produced art against it.
#
# Rules are written to be MEASURED, not admired. Where a rule cannot be measured by a script it
# says so (`review: manual`) and names the question a reviewer answers.
#
# Authority (D-062 §2): canon > gameplay/technical constraints > CHARACTER_ART_BIBLE >
# UI_UX_BIBLE > architecture/readability > MOTION_DESIGN_CONTRACT > XIANXIA_IDENTITY_CONTRACT >
# the Aetheria moodboards (visual north star only) > external references > decoration.
# Nothing here may contradict docs/CANON_LEDGER.md (closed sets: four elements, five weapon
# families, the realm ladder).

version: "1.0"

# ----------------------------------------------------------------------------------------------
# 1. PALETTE — named colours with ROLES. Hex in sRGB. A producer asks for a role, never a hex.
# ----------------------------------------------------------------------------------------------
palette:
  ink:            {hex: "#12121a", role: "the one outline and deepest shadow, sprites and UI"}
  # UI surfaces: dark ink-lacquer, cool, never pure black.
  lacquer_deep:   {hex: "#0b0f16", role: "UI surface floor / panel interior bottom"}
  lacquer:        {hex: "#141b25", role: "UI surface"}
  lacquer_lift:   {hex: "#1e2836", role: "UI surface top / hover lift"}
  lacquer_edge:   {hex: "#2c394a", role: "UI bevel highlight (1px)"}
  # Paper: the ink-and-paper half of the UI language (dialogue, records later).
  paper:          {hex: "#e6d9bf", role: "paper surface"}
  paper_shadow:   {hex: "#c4b18c", role: "paper fold / shadow"}
  # Antique gold: structure and attainment ONLY (frames, titles, level). Never a fill.
  gold:           {hex: "#c9a865", role: "antique gold line / title"}
  gold_light:     {hex: "#e6cf93", role: "gold catch-light (1px)"}
  gold_shadow:    {hex: "#7f6436", role: "gold in shadow"}
  # Jade / qi: interaction and spiritual life.
  jade:           {hex: "#5cc79e", role: "interaction accent, health, focus"}
  jade_deep:      {hex: "#2c7a63", role: "jade in shadow"}
  qi:             {hex: "#85ccea", role: "cultivation / tu vi / linh khí"}
  cinnabar:       {hex: "#b8424d", role: "danger, low health, hostile telegraph family"}
  text:           {hex: "#ebeff5", role: "primary text"}
  text_muted:     {hex: "#9ea8b8", role: "secondary text"}
  # The four elements — CLOSED set (COMBAT_DESIGN.md §3). One permanent hue each.
  elem_hoa:       {hex: "#e8743a", role: "Hỏa"}
  elem_thuy:      {hex: "#4f9fd8", role: "Thủy"}
  elem_phong:     {hex: "#9ee6b8", role: "Phong"}
  elem_loi:       {hex: "#bc9eff", role: "Lôi"}
  # The Hoang Vực world: muted greens and earth under a cool sky; colour is EARNED by meaning.
  moss:           {hex: "#436b39", role: "floor base"}
  moss_dark:      {hex: "#2f4d2c", role: "floor shadow"}
  moss_light:     {hex: "#5f9a45", role: "floor lit"}
  earth:          {hex: "#6e5a44", role: "packed earth / paths"}
  stone:          {hex: "#787a82", role: "stone"}
  wood:           {hex: "#5c3e2a", role: "timber"}
  roof_tile:      {hex: "#3a4250", role: "fired roof tile (cool slate)"}
  water:          {hex: "#1f5680", role: "still water"}

# Warm/cool relationship (measured on a gameplay frame, `style_check.py frame`):
temperature:
  world_bias: cool            # the frontier is cool and thin; warmth is a signal
  warm_pixel_share_max: 0.22  # hue in [0°,70°] with sat >= 0.25 — lanterns, gold, fire, skin
  warm_pixel_share_min: 0.03  # a frame with NO warmth reads dead
  accent_rule: "gold and element hues mark meaning (structure, attainment, a technique); they are never ambient fill"

# ----------------------------------------------------------------------------------------------
# 2. LIGHT, SHADOW, HIGHLIGHT
# ----------------------------------------------------------------------------------------------
lighting:
  key_direction: top_left       # every render and every hand-drawn highlight
  key_elevation_deg: 55
  key_azimuth_deg: 135          # from +X, counter-clockwise, viewed from above
  fill_ratio: 0.35              # fill / key intensity
  rim: {enabled: true, ratio: 0.5, colour_role: qi, use: "separates a figure from the floor"}
  shadow_steps_per_material: [2, 3]   # base + 1-2 shadow steps; more reads as noise at 32x48
  highlight: {max_px_per_material_per_frame: 6, rule: "1px; only where it clarifies form (shoulder, hair edge, blade)"}
  contact_shadow: {colour: "#0c1016", alpha: 0.38, rule: "every grounded thing has one; floating things do not"}

# ----------------------------------------------------------------------------------------------
# 3. OUTLINE
# ----------------------------------------------------------------------------------------------
outline:
  colour_role: ink
  width_px: 1
  rule: "traced from the pixels (opaque neighbours only) after palette treatment; never on glow or translucent pixels"
  sprite_outline_coverage_min: 0.85   # share of a sprite's silhouette border that is ink

# ----------------------------------------------------------------------------------------------
# 4. CHARACTER LANGUAGE (top-down 3/4 gameplay representation)
# ----------------------------------------------------------------------------------------------
character:
  cell: [32, 48]                 # binding baseline (CHARACTER_ART_BIBLE §2, D-046)
  feet_origin: bottom_centre
  height_px: [40, 47]            # opaque rows of a standing frame
  head_px: [11, 16]              # head (hair top to chin): ≈ 1/3 of height, top-down readable
  shoulder_wider_than_head_px: 2 # or the figure reads as a bowling pin
  max_colours_per_frame: 24
  orphan_pixel_share_max: 0.03   # isolated pixels: no same-colour pixel among the 8 neighbours
  silhouette:
    language: "tall, vertical, calm; a long robe that widens to the hem; long hair as a second flowing mass; sleeves as wings in motion"
    forbidden: ["bulky armour", "western plate", "anime 8-head proportions at gameplay scale", "chibi round heads"]
  costume:
    layering: ["inner robe (pale, shows at collar)", "outer robe (main mass)", "sash (one saturated accent)", "optional over-robe / mantle"]
    collar: "crossed (giao lĩnh), left over right"
    accent_rule: "ONE saturated accent per figure (sash or trim); the rest muted"
  hair: "long; carries motion (lags a beat); crown pin or tie; silhouette must separate from the robe by value"
  value_separation_min: 0.08     # mean luminance gap between hair mass and robe mass (0..1)
  review: manual
  review_questions:
    - "Does the silhouette alone say 'cultivator', not 'knight' or 'monk'?"
    - "Is it calm and vertical at rest, and does motion read through sleeves and hair?"

# ----------------------------------------------------------------------------------------------
# 5. MATERIAL LANGUAGE — every producer uses THESE profiles (Blender: blender/materials.py)
# ----------------------------------------------------------------------------------------------
materials:
  cloth:  {base_role: "per design", roughness: 0.85, sheen: 0.2, rule: "matte; folds read as value steps, not texture"}
  silk:   {base_role: "per design", roughness: 0.45, sheen: 0.6, rule: "a soft moving highlight; brighter rim"}
  wood:   {base_role: wood, roughness: 0.7, rule: "grain only at UI scale; flat at sprite scale"}
  lacquer: {base_role: lacquer, roughness: 0.25, clearcoat: 0.6, rule: "deep, cool, a single crisp edge highlight"}
  jade:   {base_role: jade, roughness: 0.2, subsurface: 0.5, rule: "translucent; glows only when it carries qi"}
  metal:  {base_role: gold, metallic: 1.0, roughness: 0.35, rule: "antique, never chrome; gold for fittings, iron-blue for blades"}
  stone:  {base_role: stone, roughness: 0.9, rule: "cool grey, weathered; moss at the base"}
  paper:  {base_role: paper, roughness: 0.95, rule: "warm, fibrous at UI scale"}
  spirit: {emission: true, rule: "qi only; has a SOURCE and a direction; emissive only while it carries force"}

# ----------------------------------------------------------------------------------------------
# 6. VFX GRAMMAR (MOTION_DESIGN_CONTRACT M-2.1 energy law)
# ----------------------------------------------------------------------------------------------
vfx:
  chain: [source, gather, focus, release, travel, impact, dissipate]
  colour: "the element's own hue + white core; never a second element's hue"
  peak_screen_share_max: 0.12   # a skill at its peak covers at most 12% of the 1280x720 frame
  emissive_share_idle_max: 0.03 # outside a VFX moment, near-white saturated 'glow' pixels
  forbidden: ["screen-wide glow", "generic blue/red blob", "camera shake on ordinary skills", "particles hiding the subject"]

# ----------------------------------------------------------------------------------------------
# 7. ICON GRAMMAR — item, equipment and skill icons are ONE family
# ----------------------------------------------------------------------------------------------
icons:
  size: [32, 32]                  # rendered 4x in Blender, adapted to 32 px; shown at 1x in UI
  frame: "ink-lacquer rounded square, 1px antique-gold hairline; skill icons add an element-hue inner ring"
  subject: "ONE object or sigil, lit top-left, contact-shadowed, filling 60–80% of the cell"
  subject_fill_share: [0.35, 0.80]
  max_colours: 40
  rule: "items are OBJECTS (pill, stone, manual, blade, robe); skills are SIGILS of the element's force"

# ----------------------------------------------------------------------------------------------
# 8. UI GRAMMAR (UI_UX_BIBLE §3c is the composition authority)
# ----------------------------------------------------------------------------------------------
ui:
  surfaces: "ink-lacquer panels with a 1px antique-gold hairline inset 3px from the edge; restrained cloud-corner marks at four corners only"
  translucency: [0.78, 0.94]      # panel interior alpha
  ornament_share_max: 0.07        # gold/ornament pixels / panel pixels (measured on the 9-slice source)
  gold_share_max: 0.10            # in a full HUD capture, gold pixels / HUD pixels
  states:
    normal:   "lacquer, gold hairline at 70%"
    hover:    "surface lifts one step, hairline to 100%, a jade 1px underline"
    focus:    "jade inner ring (1px) + corner ticks — visible with the keyboard alone"
    pressed:  "surface sinks (darker, inset shadow), content shifts 1px down"
    disabled: "desaturated surface, hairline grey, text muted — still legible"
  forbidden: ["minimap", "MP bar for unowned state", "skill ring", "chat", "right-hand menu column", "glossy mobile buttons", "four giant permanent boxes"]
  permanent_area_max: 0.15        # UIPalette.HUD_PERMANENT_AREA_BUDGET
  playfield_clear_zone: [0.25, 0.25, 0.5, 0.5]

# ----------------------------------------------------------------------------------------------
# 9. WORLD GRAMMAR
# ----------------------------------------------------------------------------------------------
world:
  depth: ["floor (z -2)", "ground decals (z -1)", "y-sorted world (z 0)", "transient VFX (z 1)"]
  rule: "grounded props with contact shadows; architecture gives the frame; vegetation clusters, never sprinkles"
  pixel_density: "1 art px = 1 world px for every sprite; never scale a sprite to fit"
  hoang_vuc: "frontier: timber-and-slate village, paddies, broken veins, mist; NOT floating palaces (R-9)"
  edge_density_target: [0.10, 0.28]   # share of strong-edge pixels in a gameplay frame (richness without noise)

# ----------------------------------------------------------------------------------------------
# 10. PIXEL ADAPTATION (Blender render → gameplay sprite)
# ----------------------------------------------------------------------------------------------
pixel_adaptation:
  render_scale: 4                 # render at 4x the cell (128x192), never pixelate a full-res image
  light_bands: [0.16, 0.40, 0.84] # light-pass thresholds: deep | shadow | base | light (linear)
  downscale: "box filter over each 4x4 block, premultiplied alpha"
  alpha_threshold: 0.5
  palette: "nearest colour in the design's own palette (design data), in a perceptual space; dithering OFF"
  cleanup: "remove orphan pixels into their majority neighbour; keep 1px highlights listed by the design"
  outline: "after palette, ink, opaque neighbours only"
  anchors: "projected from the rig's bones through the same camera, at pixel centres, feet-relative"
  verify: "aetheria_art.sheet.verify_animates — adjacent frames differ, facings differ"
